version: "3.9"

services:
  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-server
    restart: unless-stopped

  api-server:
    build: .
    container_name: api-server
    command: ["bash", "run.sh"]
    expose:
      - "5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # llama_cpp:
